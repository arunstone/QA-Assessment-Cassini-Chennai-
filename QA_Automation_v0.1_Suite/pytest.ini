[pytest]
minversion = 7.0

# --------------------------------------------------------------------
# Test discovery
# --------------------------------------------------------------------
testpaths =
    tests
python_files = test_*.py
python_functions = test_*

# --------------------------------------------------------------------
# Run behavior and failure control
# --------------------------------------------------------------------
addopts =
    -p no:locust
    -p no:pytest_locust
    -v
    -ra
    --maxfail=2
    --reruns 2
    --reruns-delay 2
    --tb=short
    --disable-warnings
    --durations=10
    --html=reports/test_report.html
    --self-contained-html
# --------------------------------------------------------------------
# Logging configuration
# --------------------------------------------------------------------
log_cli = true
log_cli_level = INFO
log_file = logs/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# --------------------------------------------------------------------
# Markers (for grouping)
# --------------------------------------------------------------------
markers =
    smoke: mark test as smoke test (critical path)
    regression: mark test as part of full regression suite
    validation: mark test as data validation check
    error: mark test as error handling
    edge: mark test as edge/boundary case
